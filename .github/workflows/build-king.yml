name: Build King v5

on:
  push:
    branches:
      - king-v5
    paths:
      - "King/**"
      - ".github/workflows/build-king.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: king-v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build King
        run: dotnet build King/Bot/Bot.csproj -c Release
