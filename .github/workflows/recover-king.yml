name: Recover King CSharp source

on:
  push:
    branches:
      - king-v5

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout King v5 branch
        uses: actions/checkout@v4
        with:
          ref: king-v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download original King assemblies
        run: |
          mkdir -p King/Recovered
          curl -fL "https://raw.githubusercontent.com/RLBot/RLBotPack/master/RLBotPack/King/Bot.dll" -o /tmp/Bot.dll
          curl -fL "https://raw.githubusercontent.com/RLBot/RLBotPack/master/RLBotPack/King/RedUtils.dll" -o /tmp/RedUtils.dll
          curl -fL "https://raw.githubusercontent.com/RLBot/RLBotPack/master/RLBotPack/RedBot/RLBotDotNet.dll" -o /tmp/RLBotDotNet.dll
          curl -fL "https://raw.githubusercontent.com/RLBot/RLBotPack/master/RLBotPack/RedBot/FlatBuffers.dll" -o /tmp/FlatBuffers.dll

      - name: Decompile King strategy assembly
        run: |
          dotnet tool install ilspycmd --tool-path /tmp/ilspy
          /tmp/ilspy/ilspycmd --referencepath /tmp /tmp/Bot.dll > King/Recovered/King.decompiled.cs
          /tmp/ilspy/ilspycmd --referencepath /tmp /tmp/RedUtils.dll > King/Recovered/RedUtils.decompiled.cs
          /tmp/ilspy/ilspycmd --referencepath /tmp -t RLBotDotNet.Bot /tmp/RLBotDotNet.dll > King/Recovered/RLBotDotNet.Bot.decompiled.cs
          test -s King/Recovered/King.decompiled.cs
          test -s King/Recovered/RedUtils.decompiled.cs
          test -s King/Recovered/RLBotDotNet.Bot.decompiled.cs

      - name: Commit recovered source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add King/Recovered/*.decompiled.cs
          if ! git diff --cached --quiet; then
            git commit -m "Recover King bot logic from published assembly"
            git push origin HEAD:king-v5
          fi
